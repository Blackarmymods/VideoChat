<!DOCTYPE html>
<html>
<head>
    <title>My Private Video Call</title>
    <style>
        #video-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 80%; margin: 20px auto; }
        .video-box { width: 100%; height: 300px; background: #222; border-radius: 10px; overflow: hidden; }
        .controls { text-align: center; margin-top: 50px; }
        input { padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; color: white; }
        .join-btn { background: #28a745; }
        .receive-btn { background: #007bff; }
    </style>
</head>
<body>

    <div class="controls">
        <h2>Video Call App</h2>
        <input type="text" id="roomID" placeholder="Room ID daalein (e.g. 555)">
        <button class="join-btn" onclick="startCall('join')">Create Room</button>
        <button class="receive-btn" onclick="startCall('receive')">Join Call</button>
        <button style="background:red;" onclick="location.reload()">Hang Up</button>
    </div>

    <div id="video-container">
        <div id="local-video" class="video-box"></div>
        <div id="remote-video" class="video-box"></div>
    </div>

    <script src="https://resource.zegocloud.com/prebuilt/crypto-js.js"></script>
    <script src="https://unpkg.com/zegoloud-prebuilt-sdk@latest/ZegoCloudPrebuilt.js"></script>

    <script>
        function startCall(mode) {
            const roomID = document.getElementById('roomID').value;
            if (!roomID) { alert("Room ID zaroori hai!"); return; }

            // Step 3 ki details yahan dalni hain
            const appID = 1424939938; // Apna AppID yahan likhein
            const serverSecret = "b018f312b5c43842278780fe921b3e2e"; // Apna Secret yahan likhein

            // User ki random ID aur Name
            const userID = Math.floor(Math.random() * 10000) + "";
            const userName = "User_" + userID;

            // Token generate karna (SDK ke through)
            const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, serverSecret, roomID, userID, userName);

            // SDK ko config karna
            const zp = ZegoUIKitPrebuilt.create(kitToken);
            
            zp.joinRoom({
                container: document.querySelector('#local-video'), // Video isi div mein dikhega
                sharedLinks: [{ name: 'Copy Link', url: window.location.origin + '?roomID=' + roomID }],
                scenario: { mode: ZegoUIKitPrebuilt.GroupCall },
                showScreenSharingButton: true,
                showUserList: false,
                maxUsers: 2,
                layout: "Grid",
                showPreJoinView: false // Direct call start hogi
            });
        }
    </script>
</body>
</html>
